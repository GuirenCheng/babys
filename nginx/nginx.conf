# Nginx 反向代理 + 负载均衡配置（挂载为 /etc/nginx/conf.d/default.conf）
# 每个服务跑 2 个实例，默认 round-robin 轮询分发

upstream gateway_upstream   { server gateway-1:8000;   server gateway-2:8000;   }
upstream commodity_upstream { server commodity-1:8000; server commodity-2:8000; }
upstream user_upstream      { server user-1:8000;      server user-2:8000;      }

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # 首页聚合 -> gateway 服务
    location /api/v1/home/ {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 商品服务
    location /api/v1/commodity/ {
        proxy_pass http://commodity_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户/订单服务
    location /api/v1/shopper/ {
        proxy_pass http://user_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台管理，落到 user 服务（同时具备 shopper + commodity 模型）
    location /admin/ {
        proxy_pass http://user_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体资源由 Nginx 直接提供
    location /media/ {
        alias /app/media/;
    }

    # 健康检查
    location /health/ {
        return 200 'ok';
    }
}
